<div class="col-12 col-sm-6 col-md-4 col-lg-4">
    <div class="card dashboards-panel-widget border-1 border-dark h-100">
        <div class="card-header">
            <strong>Activity by Event Type</strong>
        </div>
        <div class="card-body">
            {% if object_list %}
                <table class="table table-sm table-hover table-striped">
                    <thead>
                        <tr>
                            <th>Event Type</th>
                            <th>Activities</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for object in object_list %}
                            <tr>
                                <td>{{ object.verb }}</td>
                                <td>{{ object.activity_count }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p class="text-muted">No activity data available.</p>
            {% endif %}
        </div>
    </div>
</div>
