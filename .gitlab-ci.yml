default:
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - stuck_or_timeout_failure

stages:
  - stage_build_python
  - stage_test_python
  - stage_build_container
  - stage_build_documentation
  - stage_push
  - stage_deploy

variables:
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  DEBIAN_FRONTEND: "noninteractive"
  FF_USE_FASTZIP: "true"
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: "none"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

workflow:
  auto_cancel:
    on_new_commit: interruptible



job_docker_build_all:
  before_script:
    - echo ${APK_CACHE_DIR}
    - mkdir -p ${APK_CACHE_DIR}
    - rm -f /etc/apk/cache
    - ln -s ${APK_CACHE_DIR} /etc/apk/cache
    - apk update
    - apk add cairo gcc libffi-dev libjpeg-turbo-dev libmagic make musl-dev openldap-dev py3-packaging python3 python3-dev zlib-dev
  cache:
    - fallback_keys:
        - apk-cache-4.10
      key: apk-cache-4.11
      paths:
        - .cache/apk
      policy: pull-push
      when: always
  image: docker:29.2.1-cli
  needs:
    - job_docker_build_amd64
    - job_docker_build_arm64
  only:
    - ci/builds/docker/arch/all
    - ci/releases/all/major
    - ci/releases/all/minor
    - ci/releases/docker/major
    - ci/releases/docker/minor
    - ci/releases/nightly
    - ci/releases/staging/arch/all
    - ci/tests/all
    - ci/tests/docker
  script:
    - export DOCKER_IMAGE_NAME="${CI_IMAGE_NAME}"
    - export DOCKER_REGISTRY_NAME="${CI_REGISTRY}"
    - export DOCKER_REGISTRY_PASSWORD="${CI_REGISTRY_PUSH_PASSWORD}"
    - export DOCKER_REGISTRY_USERNAME="${CI_REGISTRY_PUSH_USER}"
    - make docker-registry-login docker-manifest-create docker-manifest-push
  services:
    - docker:29.2.1-dind
  stage: stage_build_container
  variables:
    APK_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/apk
    DOCKER_BUILDKIT: '1'
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''

job_docker_build_amd64:
  before_script:
    - echo ${APK_CACHE_DIR}
    - mkdir -p ${APK_CACHE_DIR}
    - rm -f /etc/apk/cache
    - ln -s ${APK_CACHE_DIR} /etc/apk/cache
    - apk update
    - mkdir -p ${PIP_CACHE_DIR}
    - if [ -x venv/bin/python ]; then echo "Restored virtual environment cache."; else rm -rf venv; fi
    - apk add cairo gcc libffi-dev libjpeg-turbo-dev libmagic make musl-dev openldap-dev py3-packaging python3 python3-dev zlib-dev
    - python3 -m venv venv
    - . venv/bin/activate
    - make dev-setup-python-essential
    - make dev-setup-python-production
  cache:
    - fallback_keys:
        - apk-cache-4.10
      key: apk-cache-4.11
      paths:
        - .cache/apk
      policy: pull-push
      when: always
    - fallback_keys:
        - pip-cache-4.10
      key: pip-cache-4.11
      paths:
        - .cache/pip
      policy: pull-push
      when: always
    - key:
        files:
          - requirements/production.txt
          - requirements/testing.txt
        prefix: venv-cache-docker-29-2-1-cli-4.11
      paths:
        - venv
      policy: pull-push
      when: always
  image: docker:29.2.1-cli
  needs: []
  only:
    - ci/builds/docker/arch/all
    - ci/builds/docker/arch/amd64
    - ci/releases/all/major
    - ci/releases/all/minor
    - ci/releases/docker/major
    - ci/releases/docker/minor
    - ci/releases/nightly
    - ci/releases/staging/arch/all
    - ci/releases/staging/arch/amd64
    - ci/tests/all
    - ci/tests/docker
  script:
    - export DOCKER_IMAGE_LABELS_EXTRA="--label com.gitlab.ci.job.id=${CI_JOB_ID} --label com.gitlab.ci.pipeline.id=${CI_PIPELINE_ID} --label org.opencontainers.image.revision=${CI_COMMIT_SHA}"
    - export DOCKER_IMAGE_NAME="${CI_IMAGE_NAME}"
    - export DOCKER_REGISTRY_NAME="${CI_REGISTRY}"
    - export DOCKER_REGISTRY_PASSWORD="${CI_REGISTRY_PUSH_PASSWORD}"
    - export DOCKER_REGISTRY_USERNAME="${CI_REGISTRY_PUSH_USER}"
    - make devops-docker-build-amd64
  services:
    - docker:29.2.1-dind
  stage: stage_build_container
  variables:
    APK_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/apk
    PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/pip
    DOCKER_BUILDKIT: '1'
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''

