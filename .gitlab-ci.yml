job_demo_deploy:
  before_script:
    - export APT_STATE_LISTS=${APT_CACHE_DIR}/lists && export APT_CACHE_ARCHIVES=${APT_CACHE_DIR}/archives
    - mkdir -p "${APT_STATE_LISTS}/partial" && mkdir -p "${APT_CACHE_ARCHIVES}/partial"
    - printf "dir::state::lists    ${APT_STATE_LISTS};\ndir::cache::archives    ${APT_CACHE_ARCHIVES};\n" > /etc/apt/apt.conf.d/99gitlab-ci-cache
    - if [ "${APT_PROXY}" ]; then echo "Acquire::http { Proxy \"http://${APT_PROXY}\"; };" > /etc/apt/apt.conf.d/01proxy; fi
    - apt-get update
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${DEMO_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - 'which ssh-agent || ( apt-get update --yes && apt-get install --yes --no-install-recommends openssh-client rsync )'
    - eval $(ssh-agent -s)
    - echo "${DEMO_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null
    - apt-get install --yes --no-install-recommends make
  cache:
    - fallback_keys:
        - apt-cache-4.10
      key: apt-cache-4.11
      paths:
        - .cache/apt
      policy: pull
      when: always
  dependencies: []
  environment:
    name: demo
  image: debian:trixie-20260421-slim
  interruptible: false
  only:
    - ci/builds/docker/arch/all
    - ci/deployments/demo
    - ci/releases/all/major
    - ci/releases/all/minor
    - ci/releases/docker/major
    - ci/releases/docker/minor
    - ci/releases/nightly
    - ci/releases/staging/arch/all
  script:
    - export REMOTE_SSH_USERNAME="${DEMO_USERNAME}"
    - export REMOTE_SSH_HOSTNAME="${DEMO_IP_ADDRESS}"
    - make devops-demo-deploy
  stage: stage_deploy
  when: manual
  variables:
    APT_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/apt

