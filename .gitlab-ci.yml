job_documentation_build:
  artifacts:
    expire_in: 24 hr
    paths:
    - docs/_build/html
  before_script:
    - export APT_STATE_LISTS=${APT_CACHE_DIR}/lists && export APT_CACHE_ARCHIVES=${APT_CACHE_DIR}/archives
    - mkdir -p "${APT_STATE_LISTS}/partial" && mkdir -p "${APT_CACHE_ARCHIVES}/partial"
    - printf "dir::state::lists    ${APT_STATE_LISTS};\ndir::cache::archives    ${APT_CACHE_ARCHIVES};\n" > /etc/apt/apt.conf.d/99gitlab-ci-cache
    - if [ "${APT_PROXY}" ]; then echo "Acquire::http { Proxy \"http://${APT_PROXY}\"; };" > /etc/apt/apt.conf.d/01proxy; fi
    - apt-get update
    - mkdir -p ${PIP_CACHE_DIR}
    - if [ -x venv/bin/python ]; then echo "Restored virtual environment cache."; else rm -rf venv; fi
    - apt-get install --yes --no-install-recommends enchant-2 g++ gcc graphviz libcairo2 libffi-dev libjpeg-dev libldap2-dev libpng-dev libsasl2-dev libssl-dev libtiff-dev make pkg-config python3-dev python3-venv zlib1g-dev
    - python3 -m venv venv
    - . venv/bin/activate
    - make dev-setup-python-essential
  cache:
    - fallback_keys:
        - apt-cache-4.10
      key: apt-cache-4.11
      paths:
        - .cache/apt
      policy: pull-push
      when: always
    - fallback_keys:
        - pip-cache-4.10
      key: pip-cache-4.11
      paths:
        - .cache/pip
      policy: pull-push
      when: always
    - key:
        files:
          - requirements/production.txt
          - requirements/testing.txt
        prefix: venv-cache-debian-trixie-20260421-slim-4.11
      paths:
        - venv
      policy: pull-push
      when: always
  image: debian:trixie-20260421-slim
  needs: []
  only:
    - ci/builds/documentation
    - ci/releases/all/major
    - ci/releases/documentation
    - ci/tests/all
  script:
    - make dev-setup-python-production
    - make dev-setup-python-documentation
    - make docs-html
  stage: stage_build_documentation
  variables:
    APT_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/apt
    PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/pip

job_documentation_push:
  before_script:
    - export APT_STATE_LISTS=${APT_CACHE_DIR}/lists && export APT_CACHE_ARCHIVES=${APT_CACHE_DIR}/archives
    - mkdir -p "${APT_STATE_LISTS}/partial" && mkdir -p "${APT_CACHE_ARCHIVES}/partial"
    - printf "dir::state::lists    ${APT_STATE_LISTS};\ndir::cache::archives    ${APT_CACHE_ARCHIVES};\n" > /etc/apt/apt.conf.d/99gitlab-ci-cache
    - if [ "${APT_PROXY}" ]; then echo "Acquire::http { Proxy \"http://${APT_PROXY}\"; };" > /etc/apt/apt.conf.d/01proxy; fi
    - apt-get update
    - mkdir --parents ~/.ssh
    - chmod 700 ~/.ssh
    - echo "${DOCUMENTATION_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - 'which ssh-agent || ( apt-get update --yes && apt-get install --yes --no-install-recommends openssh-client rsync )'
    - eval $(ssh-agent -s)
    - echo "${DOCUMENTATION_SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null
    - apt-get install --yes --no-install-recommends make
  cache:
    - fallback_keys:
        - apt-cache-4.10
      key: apt-cache-4.11
      paths:
        - .cache/apt
      policy: pull
      when: always
  dependencies:
    - job_documentation_build
  image: debian:trixie-20260421-slim
  interruptible: false
  only:
    - ci/releases/all/major
    - ci/releases/documentation
  script:
    - export REMOTE_SSH_USERNAME="${DOCUMENTATION_SSH_USERNAME}"
    - export REMOTE_SSH_HOSTNAME="${DOCUMENTATION_HOSTNAME}"
    - export REMOTE_DOCUMENTATION_PATH="${DOCUMENTATION_SERVER_PATH}"
    - make devops-documentation-deploy
  stage: stage_push
  variables:
    APT_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/apt



